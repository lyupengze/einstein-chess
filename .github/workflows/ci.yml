name: CI

# dev 上每次提交都验证；main 作为发布兜底；PR 在合并前验证。
# 功能分支的普通 push 不触发，有 PR 时自然会跑。
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支/PR 只保留最新一次运行，避免旧提交堆积。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 格式检查独立成一个 job：不需要 Qt/MSYS2，失败信息也最直观。
  # 版本以 .clang-format 顶部的基线注释为准，安装后核对，避免本地/CI 结果不一致。
  format:
    name: clang-format (23.1.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: |
          set -euo pipefail
          expected="$(grep -oE 'clang-format [0-9]+\.[0-9]+\.[0-9]+' .clang-format | head -n1 | awk '{print $2}')"
          if [ -z "${expected}" ]; then
            echo "未在 .clang-format 顶部找到格式基线版本" >&2
            exit 1
          fi
          echo "基线版本：${expected}"
          python -m pip install --disable-pip-version-check --no-cache-dir "clang-format==${expected}"
          actual="$(clang-format --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          echo "实际版本：${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "clang-format 版本与 .clang-format 基线不一致" >&2
            exit 1
          fi

      - name: Check formatting
        run: |
          set -euo pipefail
          # 只检查仓库内的 C++ 源码；third_party/ 不在 src/、tests/、benchmarks/ 下，天然排除。
          mapfile -t files < <(git ls-files -- 'src' 'tests' 'benchmarks' | grep -E '\.(cpp|h|hpp)$')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ files found under src/, tests/ or benchmarks/" >&2
            exit 1
          fi
          echo "Checking ${#files[@]} C++ files with clang-format 23.1.1"
          clang-format --dry-run --Werror "${files[@]}"

  # 文档与注释检查独立成 job：只依赖 CMake 本身，不依赖 Qt/MSYS2。
  docs:
    name: 文档与注释一致性
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check comments and docs
        run: cmake -P tools/check_repo.cmake

  windows-ucrt64:
    name: Windows UCRT64 (Qt GUI)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base

      - name: Configure
        run: |
          # 从 gcc 的位置推导 MSYS2 前缀，避免写死 C:/msys64。
          MINGW_PREFIX="$(dirname "$(dirname "$(command -v gcc)")")"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$MINGW_PREFIX")" \
            -DEINSTEIN_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2

      - name: Upload CTest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-full
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  windows-ucrt64-nogui:
    name: Windows UCRT64 (no GUI)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEINSTEIN_BUILD_TESTS=ON \
            -DEINSTEIN_BUILD_GUI=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2

      - name: Upload CTest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-nogui
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
